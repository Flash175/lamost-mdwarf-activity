# conda/mamba 环境：复现流程 + Snakemake
#   mamba env create -f envs/analysis.yml
#   conda activate mdwarf-repro
#   snakemake -n
name: mdwarf-repro
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.24
  - scipy>=1.10
  - astropy>=5.3
  - matplotlib>=3.7
  - pillow>=10
  - pyarrow>=14
  - snakemake-minimal>=8
  - pip
